spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:college_recommendation}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:zhiyuan}
    password: ${DB_PASSWORD:zhiyuan123}
  sql:
    init:
      mode: ${DB_SCHEMA_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

ai:
  qwen:
    enabled: ${QWEN_ENABLED:true}

auth:
  jwt-secret: ${AUTH_JWT_SECRET:emhpeXVhbi1kZXYtc2VjcmV0LXpoaXl1YW4tZGV2LXNlY3JldC0yMDI2LWtleQ==}
  # sql/data.sql seeds demo accounts with clear-text passwords, so local development
  # keeps the legacy login path enabled. It is off in application.yml and prod.
  allow-legacy-plaintext-login: ${AUTH_ALLOW_LEGACY_PLAINTEXT_LOGIN:true}

security:
  expose-api-docs: ${SECURITY_EXPOSE_API_DOCS:true}

cache:
  redis:
    enabled: ${CACHE_REDIS_ENABLED:false}

messaging:
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}

logging:
  level:
    com.zhiyuan.college: INFO

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
