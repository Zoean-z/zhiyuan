spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:college_recommendation}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:zhiyuan}
    password: ${DB_PASSWORD:zhiyuan123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
  sql:
    init:
      mode: ${DB_SCHEMA_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
ai:
  qwen:
    enabled: ${QWEN_ENABLED:true}
    base-url: ${QWEN_BASE_URL:https://api.deepseek.com}
    model: ${QWEN_MODEL:deepseek-v4-flash}
    api-key: ${QWEN_API_KEY:}
    retry:
      max-attempts: ${QWEN_RETRY_MAX_ATTEMPTS:3}
      backoff-millis: ${QWEN_RETRY_BACKOFF_MILLIS:150}
    # Hard timeouts for the upstream LLM call. Without them a hung provider would
    # pin request threads until the container is restarted.
    timeout:
      connect-millis: ${QWEN_TIMEOUT_CONNECT_MILLIS:5000}
      read-millis: ${QWEN_TIMEOUT_READ_MILLIS:30000}
auth:
  token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:86400}
  # Local development fallback only. Production MUST provide AUTH_JWT_SECRET
  # (>= 32 bytes of key material, e.g. `openssl rand -base64 48`).
  jwt-secret: ${AUTH_JWT_SECRET:emhpeXVhbi1kZXYtc2VjcmV0LXpoaXl1YW4tZGV2LXNlY3JldC0yMDI2LWtleQ==}
  jwt-issuer: ${AUTH_JWT_ISSUER:zhiyuan}
  # Allows logging in against demo accounts whose password is still stored in clear
  # text (sql/data.sql seed data). Disabled by default; enable only for local demos.
  allow-legacy-plaintext-login: ${AUTH_ALLOW_LEGACY_PLAINTEXT_LOGIN:false}
security:
  # OpenAPI/Swagger routes are blocked by the security filter chain unless this is true.
  expose-api-docs: ${SECURITY_EXPOSE_API_DOCS:false}
recommendation:
  scoring:
    minimum-probability: ${RECOMMENDATION_MINIMUM_PROBABILITY:35}
    rank-weight: ${RECOMMENDATION_RANK_WEIGHT:0.75}
    score-weight: ${RECOMMENDATION_SCORE_WEIGHT:0.25}
    rush:
      min: ${RECOMMENDATION_RUSH_MIN:35}
      max: ${RECOMMENDATION_RUSH_MAX:54}
    safe:
      min: ${RECOMMENDATION_SAFE_MIN:55}
      max: ${RECOMMENDATION_SAFE_MAX:74}
    guarantee:
      min: ${RECOMMENDATION_GUARANTEE_MIN:75}
      max: ${RECOMMENDATION_GUARANTEE_MAX:100}
cache:
  redis:
    # Default off so a bare `mvn spring-boot:run` works without Redis.
    # Docker Compose and the prod profile turn this on.
    enabled: ${CACHE_REDIS_ENABLED:false}
    recommendation-ttl: ${CACHE_RECOMMENDATION_TTL:10m}
    meta-ttl: ${CACHE_META_TTL:30m}
messaging:
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    topic: ${ROCKETMQ_RECOMMENDATION_TOPIC:recommendation-task-topic}
    tag: ${ROCKETMQ_RECOMMENDATION_TAG:free-text}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:recommendation-task-consumer-group}
    send-timeout-ms: ${ROCKETMQ_SEND_TIMEOUT_MS:3000}
    running-timeout: ${ROCKETMQ_RUNNING_TIMEOUT:5m}
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
